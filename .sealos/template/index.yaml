apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: ui-manage
spec:
  title: ui-manage 设计稿管理
  url: ''
  gitRepo: ''
  author: ''
  description: OpenPencil 编辑器 + tRPC API + Prisma/PostgreSQL
  readme: ''
  icon: ''
  templateType: inline
  locale: en
  categories: []
  defaults:
    app_name:
      type: string
      value: ui-manage-${{ random(8) }}
    app_host:
      type: string
      value: ui-manage-${{ random(8) }}
  inputs: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
- kind: ServiceAccount
  name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
  name: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
  - componentDefRef: postgresql
    disableExporter: true
    enabledLogs:
    - running
    name: postgresql
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 102Mi
      limits:
        cpu: 500m
        memory: 1024Mi
    serviceAccountName: ${{ defaults.app_name }}-pg
    switchPolicy:
      type: Noop
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: PG_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: endpoint
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          host="${PG_ENDPOINT%:*}"
          port="${PG_ENDPOINT##*:}"
          for i in $(seq 1 60); do
            if PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1
          for db in app; do
            if ! PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; then
              PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${db}\";"
            fi
          done
        resources:
          requests:
            cpu: 50m
            memory: 51Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-ui-manage
  annotations:
    originImageName: harbor.bja.sealos.run/ns-bk7v1fnd/project-a1b0658fd/ui-manage:20261121-170815
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-ui-manage
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui-manage
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-ui-manage
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-ui-manage
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: harbor-registry-cred-hp-ns-bk7v1fnd
      initContainers:
      - name: wait-db-pg
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: PG_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: endpoint
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          host="${PG_ENDPOINT%:*}"
          port="${PG_ENDPOINT##*:}"
          for i in $(seq 1 60); do
            if PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1
          for db in app; do
            until PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; do
              echo "Waiting for database ${db}..."
              sleep 5
            done
          done
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
      containers:
      - name: ${{ defaults.app_name }}-ui-manage
        image: harbor.bja.sealos.run/ns-bk7v1fnd/project-a1b0658fd/ui-manage:20261121-170815
        imagePullPolicy: IfNotPresent
        env:
        - name: SEALOS_DB_PG_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: username
        - name: SEALOS_DB_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: PORT
          value: '3000'
        - name: HOST
          value: 0.0.0.0
        - name: NODE_ENV
          value: production
        - name: MCP_ENABLE
          value: '1'
        - name: DATABASE_URL
          value: postgresql://$(SEALOS_DB_PG_USERNAME):$(SEALOS_DB_PG_PASSWORD)@${{ defaults.app_name }}-pg-postgresql:5432/app
        - name: S3_REGION
          value: us-east-1
        - name: S3_FORCE_PATH_STYLE
          value: 'true'
        resources:
          requests:
            cpu: 50m
            memory: 102Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        ports:
        - containerPort: 3000
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-ui-manage
  labels:
    app: ${{ defaults.app_name }}-ui-manage
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui-manage
spec:
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-ui-manage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-ui-manage
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui-manage
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}-ui-manage
            port:
              number: 3000
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}-ui-manage
  labels:
    app: ${{ defaults.app_name }}-ui-manage
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui-manage
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: ''
  name: ui-manage 设计稿管理
  type: link
